<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator Aritmatika</title>
<style>
  *{box-sizing:border-box;font-family:Arial,sans-serif}
  body{margin:0;background:#f1f3f6;display:flex;justify-content:center;padding:20px 12px}
  .card{background:#fff;width:100%;max-width:480px;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.1)}
  .header{background:#007bff;color:#fff;text-align:center;padding:24px 16px 20px}
  .header h1{margin:0;font-size:28px}
  .header p{margin:8px 0 0;font-size:16px}
  .body{padding:24px 20px 28px}
  label{display:block;font-weight:bold;font-size:18px;margin:18px 0 8px}
  label:first-child{margin-top:0}
  input,select{width:100%;padding:14px 16px;font-size:17px;border:1px solid #ddd;border-radius:10px;outline:none}
  select{background:#eef1f4}
  input:focus{border-color:#007bff}
  button{width:100%;margin-top:22px;background:#007bff;color:#fff;border:none;padding:15px;font-size:19px;font-weight:bold;border-radius:10px;cursor:pointer}
  button:active{transform:scale(.98)}
  .hasil{background:#262a33;color:#fff;text-align:center;border-radius:14px;padding:18px;margin-top:18px}
  .hasil span{font-size:19px;opacity:.9}
  .hasil b{display:block;font-size:48px;margin-top:4px}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>Kalkulator Aritmatika</h1>
    <p>Fitria Nuraini - 262302005</p>
  </div>
  <div class="body">
    <label>Angka 1</label>
    <input type="number" id="angka1" value="25" placeholder="Masukkan angka 1">
    <label>Operasi</label>
    <select id="operasi">
      <option value="tambah">Tambah (+)</option>
      <option value="kurang">Kurang (-)</option>
      <option value="kali">Kali (×)</option>
      <option value="bagi">Bagi (÷)</option>
    </select>
    <label>Angka 2</label>
    <input type="number" id="angka2" value="10" placeholder="Masukkan angka 2">
    <button onclick="hitung()">Hitung</button>
    <div class="hasil">
      <span>Hasil</span>
      <b id="hasil">35</b>
    </div>
  </div>
</div>
<script>
function hitung(){
  let a = parseFloat(document.getElementById('angka1').value);
  let b = parseFloat(document.getElementById('angka2').value);
  let op = document.getElementById('operasi').value;
  let h = document.getElementById('hasil');
  if(isNaN(a) || isNaN(b)){ h.textContent = 'Isi dulu angkanya'; return; }
  if(op==='tambah') h.textContent = a + b;
  if(op==='kurang') h.textContent = a - b;
  if(op==='kali') h.textContent = a * b;
  if(op==='bagi') h.textContent = b===0 ? 'Tidak bisa dibagi 0' : a / b;
}
</script>
</body>
</html>
