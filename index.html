<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator - Fitria Nur'aini</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; background: #f0f2f5; margin-top: 40px; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h2 { margin: 0; color: #333; }
        .header p { margin: 5px 0; color: #666; }
        .calc { background: #222; padding: 20px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); width: 300px; }
        #display { width: 100%; height: 60px; font-size: 28px; text-align: right; border: none; border-radius: 10px; padding: 10px; box-sizing: border-box; margin-bottom: 15px; background: #fff; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        button { height: 55px; font-size: 18px; border: none; border-radius: 10px; cursor: pointer; background: #333; color: white; }
        button.operator { background: #ff9500; }
        button.clear { background: #ff3b30; }
        button.equal { background: #34c759; grid-column: span 2; }
        button:hover { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="header">
        <h2>Kalkulator Sederhana</h2>
        <p>Nama: Fitria Nur'aini</p>
        <p>NIM: 262302005</p>
    </div>

    <div class="calc">
        <input type="text" id="display" readonly placeholder="0">
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="deleteChar()">DEL</button>
            <button onclick="append('%')">%</button>
            <button class="operator" onclick="append('/')">/</button>
            <button onclick="append('7')">7</button>
            <button onclick="append('8')">8</button>
            <button onclick="append('9')">9</button>
            <button class="operator" onclick="append('*')">x</button>
            <button onclick="append('4')">4</button>
            <button onclick="append('5')">5</button>
            <button onclick="append('6')">6</button>
            <button class="operator" onclick="append('-')">-</button>
            <button onclick="append('1')">1</button>
            <button onclick="append('2')">2</button>
            <button onclick="append('3')">3</button>
            <button class="operator" onclick="append('+')">+</button>
            <button onclick="append('0')">0</button>
            <button onclick="append('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        // Kalkulator - Fitria Nur'aini - NIM 262302005
        let display = document.getElementById('display');
        function append(value) { display.value += value; }
        function clearDisplay() { display.value = ''; }
        function deleteChar() { display.value = display.value.slice(0, -1); }
        function calculate() {
            try {
                display.value = eval(display.value);
            } catch {
                display.value = 'Error';
            }
        }
    </script>
</body>
</html>
